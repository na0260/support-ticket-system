name: Deploy to cPanel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, bcmath, pdo, curl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Production Dependencies & Build Assets
        run: |
          cd src
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci
          npm run build

      - name: Sync Files to cPanel via Rsync
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.CPANEL_HOST }}
          REMOTE_USER: ${{ secrets.CPANEL_USER }}
          REMOTE_PORT: ${{ secrets.CPANEL_PORT }}
          SOURCE: "src/"
          TARGET: "/home/${{ secrets.CPANEL_USER }}/app_deploy/support-ticket/src"
          SSH_CMD_ARGS: "-4 -p ${{ secrets.CPANEL_PORT }} -o StrictHostKeyChecking=no"
          ARGS: "-rlgoDzvc -i --delete --exclude='.git*' --exclude='.env' --exclude='storage/logs/*' --exclude='storage/framework/sessions/*'"

      - name: Execute Artisan Commands on cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          port: ${{ secrets.CPANEL_PORT }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            cd /home/${{ secrets.CPANEL_USER }}/app_deploy/support-ticket/src
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
